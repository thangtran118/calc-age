<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💖 Máy Tính Tuổi Thần Kỳ 💖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 50%, #fbcfe8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 30px;
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(236, 72, 153, 0.15);
            border: 2px solid rgba(251, 207, 232, 0.3);
            text-align: center;
            position: relative;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .bow {
            font-size: 60px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        h1 {
            color: #ec4899;
            margin: 20px 0;
            font-size: 28px;
            text-shadow: 2px 2px 4px rgba(236, 72, 153, 0.2);
        }

        .subtitle {
            color: #db2777;
            font-size: 16px;
            margin-bottom: 30px;
            font-style: italic;
        }

        .input-group {
            margin: 30px 0;
        }

        label {
            display: block;
            color: #ec4899;
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        input[type="number"] {
            width: 100%;
            padding: 15px;
            border: 3px solid #fbcfe8;
            border-radius: 15px;
            font-size: 24px;
            text-align: center;
            color: #db2777;
            font-weight: bold;
            transition: all 0.3s;
            background: #fdf2f8;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #ec4899;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.3);
        }

        .btn {
            background: linear-gradient(135deg, #ec4899, #db2777);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(236, 72, 153, 0.3);
            transition: all 0.3s;
            margin-top: 20px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(236, 72, 153, 0.4);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .paw-prints {
            font-size: 30px;
            margin: 20px 0;
            letter-spacing: 10px;
            animation: pawWalk 3s infinite;
        }

        @keyframes pawWalk {
            0%, 100% {
                opacity: 0.5;
            }
            50% {
                opacity: 1;
            }
        }

        .result {
            display: none;
            animation: resultPop 0.5s ease-out;
        }

        @keyframes resultPop {
            0% {
                transform: scale(0);
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }

        .result.show {
            display: block;
        }

        .result-content {
            background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 50%, #fbcfe8 100%);
            color: #db2777;
            padding: 40px 30px;
            border-radius: 25px;
            margin-top: 20px;
            border: 3px solid rgba(251, 207, 232, 0.6);
            box-shadow: 0 10px 30px rgba(236, 72, 153, 0.15), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.5);
            position: relative;
            overflow: hidden;
        }

        .result-content::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(251, 207, 232, 0.3) 0%, transparent 70%);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0%, 100% {
                transform: rotate(0deg);
            }
            50% {
                transform: rotate(180deg);
            }
        }

        .result-content h2 {
            font-size: 32px;
            margin-bottom: 20px;
            color: #ec4899;
            position: relative;
            z-index: 1;
            text-shadow: 1px 1px 2px rgba(251, 207, 232, 0.8);
        }

        .result-content p {
            font-size: 18px;
            line-height: 1.8;
            margin: 10px 0;
            position: relative;
            z-index: 1;
            color: #db2777;
        }

        .age-display {
            font-size: 72px;
            font-weight: bold;
            margin: 25px 0;
            background: linear-gradient(135deg, #ec4899, #db2777);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            z-index: 1;
            text-shadow: none;
            filter: drop-shadow(2px 2px 4px rgba(251, 207, 232, 0.5));
        }

        .sparkles {
            font-size: 28px;
            animation: sparkle 1.5s infinite alternate;
            margin-bottom: 15px;
            color: #ec4899;
            filter: drop-shadow(0 0 3px rgba(236, 72, 153, 0.5));
        }

        @keyframes sparkle {
            from {
                opacity: 0.6;
                transform: scale(0.9) rotate(-5deg);
            }
            to {
                opacity: 1;
                transform: scale(1.1) rotate(5deg);
            }
        }

        .hearts {
            position: absolute;
            font-size: 20px;
            animation: float 3s infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(10deg);
            }
        }

        .heart1 { top: 10px; left: 10px; animation-delay: 0s; }
        .heart2 { top: 10px; right: 10px; animation-delay: 0.5s; }
        .heart3 { bottom: 10px; left: 10px; animation-delay: 1s; }
        .heart4 { bottom: 10px; right: 10px; animation-delay: 1.5s; }

        .reset-btn {
            background: white;
            color: #ec4899;
            border: 3px solid #ec4899;
            margin-top: 15px;
        }

        .reset-btn:hover {
            background: #fdf2f8;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .subtitle {
                font-size: 14px;
            }

            .age-display {
                font-size: 56px;
            }

            .result-content {
                padding: 30px 20px;
            }

            .result-content h2 {
                font-size: 26px;
            }

            .result-content p {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hearts heart1">💕</div>
        <div class="hearts heart2">💖</div>
        <div class="hearts heart3">💗</div>
        <div class="hearts heart4">💝</div>

        <div id="formSection">
            <div class="bow">🎀</div>
            <h1>✨ Máy tính tuổi✨</h1>
            <p class="subtitle">Khám phá bí mật tuổi tác của bạn...</p>
            
            <div class="paw-prints">🐾 🐾 🐾</div>
            
            <div class="input-group">
                <label for="yearInput">Nhập năm sinh của bạn:</label>
                <input type="number" id="yearInput" placeholder="Ví dụ: 2000">
            </div>
            
            <button class="btn" onclick="calculateAge()">
                ✨ Xem kết quả ✨
            </button>
        </div>

        <div id="resultSection" class="result">
            <div class="sparkles">✨ ⭐ ✨ ⭐ ✨</div>
            <div class="result-content">
                <h2>🎉 Chúc Mừng! 🎉</h2>
                <p style="font-size: 16px; color: #ec4899; margin-bottom: 15px;">Tuổi thật của bạn là:</p>
                <div class="age-display">18</div>
                <div class="paw-prints" style="font-size: 28px; margin: 20px 0;">🐾 🐾 🐾</div>
                <p style="font-size: 20px; font-weight: 600; color: #ec4899; margin: 15px 0;">Bạn mãi mãi 18 tuổi!</p>
            </div>
            <button class="btn reset-btn" onclick="reset()">
                🔄 Thử lại nào
            </button>
        </div>
    </div>

    <script>
        const yearInput = document.getElementById('yearInput');

        function calculateAge() {
            const birthYear = yearInput.value;
            
            if (!birthYear) {
                alert('Vui lòng nhập năm sinh của bạn! 💕');
                return;
            }
            
            if (birthYear.length !== 4) {
                alert('Vui lòng nhập năm sinh hợp lệ! 💕');
                return;
            }
            
            // Bất kỳ năm sinh nào cũng sẽ hiển thị kết quả 18 tuổi
            // Ẩn form và hiện kết quả
            document.getElementById('formSection').style.display = 'none';
            document.getElementById('resultSection').classList.add('show');
        }

        function reset() {
            document.getElementById('formSection').style.display = 'block';
            document.getElementById('resultSection').classList.remove('show');
            yearInput.value = '';
        }

        // Easter egg: Khi click vào nơ
        document.querySelector('.bow').addEventListener('click', function() {
            this.style.transform = 'rotate(360deg) scale(1.5)';
            this.style.transition = 'all 0.5s';
            setTimeout(() => {
                this.style.transform = '';
            }, 500);
        });
    </script>
</body>
</html>
